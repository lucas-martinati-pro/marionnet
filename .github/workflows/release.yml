name: Release Marionnet

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version à publier, avec ou sans "v" initial (ex. 1.0.458 ou v1.0.458). Laisser vide pour auto-détection depuis META/VCS'
        required: false
        default: ''
      release_title:
        description: 'Titre de la release (optionnel)'
        required: false
        default: ''
      release_notes:
        description: 'Notes de version (optionnel)'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-22.04
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Détermination de la version
        id: get_version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          VERSION=""
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$VERSION" ] && [ -f bin/meta.ml.maker.sh ]; then
            VERSION="$(bash bin/meta.ml.maker.sh --print-version 2>/dev/null || true)"
          fi
          if [ -z "$VERSION" ] && [ -f META ]; then
            VERSION="$(grep -Po '(?<=version=")[^"]*' META 2>/dev/null || true)"
          fi
          # Tolère un "v" initial ("v1.0.458" comme "1.0.458"), d'où qu'il vienne.
          VERSION="${VERSION#v}"
          VERSION="${VERSION#V}"
          if [[ ! $VERSION =~ ^[0-9]+(\.[0-9]+)+$ ]]; then
            echo "[-] Erreur : version introuvable ou invalide ($VERSION)" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Version sélectionnée : $VERSION"

      - name: Installation des dépendances système C/GTK
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libgtksourceview-3.0-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libcairo2-dev \
            libpango1.0-dev \
            fakeroot \
            dpkg-dev \
            curl \
            jq \
            gettext

      - name: Configuration de l'environnement OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.4.0
          dune-cache: true

      - name: Installation des paquets OPAM
        run: |
          opam install -y dune dune-site camlp4 camlp-streams inotify lablgtk3 lablgtk3-sourceview3 conf-gtksourceview3 yojson base64 cmarkit

      - name: Synchronisation du numéro de version dans META
        run: |
          sed -i "s/^version=\".*\"/version=\"$VERSION\"/" META
          echo "Contenu de META :"
          grep '^version=' META

      - name: Compilation de Marionnet avec Dune
        run: |
          opam exec -- dune build bin/marionnet.exe
          ./_build/default/bin/marionnet.exe -v
          echo "--> Vérification des versions GLIBC référencées :"
          readelf -V ./_build/default/bin/marionnet.exe | grep -A 25 "File: libc.so.6" || true

      - name: Construction du paquet Tout-en-un (marionnet-all-in-one)
        run: |
          chmod +x dist/build-all-in-one.sh
          opam exec -- ./dist/build-all-in-one.sh "$VERSION"
          ls -lh dist/*.deb

      - name: Publication de la Release GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${VERSION}"
          TITLE="${{ github.event.inputs.release_title }}"
          if [ -z "$TITLE" ]; then
            TITLE="Marionnet ${VERSION} (Édition Linux Moderne)"
          fi

          if [ -n "${{ github.event.inputs.release_notes }}" ]; then
            NOTES_ARG=(--notes "${{ github.event.inputs.release_notes }}")
          elif [ -f release.md ]; then
            sed "s/@VERSION@/${VERSION}/g" release.md > /tmp/release_notes.md
            NOTES_ARG=(--notes-file /tmp/release_notes.md)
          else
            NOTES_ARG=(--notes "Release automatique de Marionnet ${VERSION}.")
          fi

          echo "Publication de la release $TAG..."
          ASSETS=( dist/marionnet-all-in-one_"${VERSION}"_amd64.deb )
          if [ -f dist/marionnet-fs-debian-wheezy_08367_all.deb ]; then
            ASSETS+=( dist/marionnet-fs-debian-wheezy_08367_all.deb )
          fi
          if [ -f dist/SHA256SUMS ]; then
            ASSETS+=( dist/SHA256SUMS )
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "La release $TAG existe déjà, mise à jour des assets..."
            gh release edit "$TAG" "${NOTES_ARG[@]}" --title "$TITLE"
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "$TITLE" \
              "${NOTES_ARG[@]}"
          fi
