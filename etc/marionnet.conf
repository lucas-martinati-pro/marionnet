# This file can be installed into /etc/marionnet to make a "global"
# site configuration, and each user can override some or all values
# in his/her private ~/.marionnet file.
#
# Each user can also override these settings by defining the same
# variables in the shell environment, before launching Marionnet.

# The host bridge a LAN bridge component attaches its tap to.
#
# LEAVE IT COMMENTED OUT unless you know why you are setting it. Marionnet now
# builds that bridge itself, when a LAN bridge component starts (it puts this
# computer's network card into a bridge named mnlan0, moves the host address and
# default route onto it, and gives everything back afterwards), and asks for your
# password once in order to be allowed to do it.
#
# Setting this variable turns that off: Marionnet then attaches to the bridge
# named here and touches nothing on the host -- which is what you want on a
# machine where an administrator has already built a bridge by hand, and only
# there. It used to be set to br0 by default, from the days when building that
# bridge by hand was the only way (work-stream modernisation-world-bridge, ep. 7b).
#
# On a host upgraded rather than installed from scratch, /etc/marionnet/marionnet.conf
# may still carry the old `MARIONNET_BRIDGE=br0' line. Setting the variable to the
# EMPTY string -- here, in ~/.marionnet/marionnet.conf, or in the environment --
# counts as "not configured" and gives the automatic behaviour back.
#
#MARIONNET_BRIDGE=br0

# The keyboard layout for virtual machines starting in Xnest mode:
MARIONNET_KEYBOARD_LAYOUT=us

# You should leave this set as "false" if you are not developing Marionnet:
MARIONNET_DEBUG=false

# Helper programs used for opening documents in the Énoncé tab. Each of them is checked before
# being launched: when the program named here is not installed, Marionnet falls back on the first
# available among xdg-open and a few usual readers, instead of doing nothing at all (which is what
# happened as long as this file recommended `galeon', a browser gone since about 2010).
MARIONNET_PDF_READER=evince
MARIONNET_POSTSCRIPT_READER=evince
MARIONNET_DVI_READER=evince
MARIONNET_HTML_READER=xdg-open
MARIONNET_TEXT_EDITOR=emacs

# Markdown documents -- the end-of-session report of a guest, typically -- are converted to HTML
# by Marionnet itself and shown with MARIONNET_HTML_READER. The conversion being in-process, the
# very same page is displayed on every machine which opens a project, and the raw HTML possibly
# written INSIDE a guest (i.e. on a machine a student controls) is neutralized: it cannot run in
# the page a corrector reads. The source of the document remains one gesture away, in the
# contextual menu of the documents treeview, where it can also be annotated.
#
# Setting the variable below replaces that conversion by an external command, which reads the
# Markdown on its standard input and writes HTML on its standard output. It buys a richer
# rendering, and gives up the two properties above: the page then depends on what is installed on
# the machine which opens the project, and nothing filters what the guest wrote. Marionnet falls
# back on its own conversion if the command is missing, fails, or answers nothing.
#MARIONNET_MARKDOWN_TO_HTML="pandoc -f markdown -t html"

# Optional prefix for vde executables (the prefix may be a path with a trailing
# slash, part of the a file name, or both (with a slash between the path and
# the file name part)):
MARIONNET_VDE_PREFIX=

# It is possible to choose the Terminal used by Marionnet to launch virtual
# host, it is necessary to specify option used to choose title and option
# used to execute a command in the Terminal, separated by comma (by default
# "xterm,-T,-e" is used), you can see examples below or use the "--help"
# switch to know options of your Terminal
#MARIONNET_TERMINAL="xterm,-T,-e"
#MARIONNET_TERMINAL="rxvt,-title,-e"
#MARIONNET_TERMINAL="gnome-terminal,-t,-x"
#MARIONNET_TERMINAL="konsole,-T,-e"

# It is possible to override the installation path, or the directory containing
# UML kernels and UML filesystems defined at compile-time;
# this is particularly useful for packagers or non-root
# users who want to setup Marionnet without writing to system paths.
# Leave this alone if you're not sure whether you need this.
#
# No trailing slashes.
#MARIONNET_PREFIX=/usr/local/share/marionnet
#MARIONNET_FILESYSTEMS_PATH=${MARIONNET_PREFIX}/filesystems
#MARIONNET_KERNELS_PATH=${MARIONNET_PREFIX}/kernels
#MARIONNET_LOCALEPREFIX=/usr/local/share/locale

# Variants could be saved in this local directory
MARIONNET_USER_VARIANTS_PATH=.marionnet/filesystems

# The router filesystem must have a filename starting with the prefix "router-" and
# ending with the value of this variable; if the variable is not specified its default
# value is assumed to be "default":
#MARIONNET_ROUTER_FILESYSTEM=

# Default for the factory-set configuration address for routers
MARIONNET_ROUTER_PORT0_DEFAULT_IPV4_CONFIG=192.168.1.254/24

# Force the Marionnet's temporary working directory.
# Note that this directory must reside on a filesystem supporting sparse files
# (reiserfs, reiser4, ext4, ext4dev, ext3, ext2, udf, ntfs, jfs, ufs, tmpfs,
#  vxfs and xiafs are accepted)
# Note also that Marionnet will choose the first suitable directory in the list:
# $MARIONNET_TMPDIR, $TMPDIR, /tmp, /var/tmp, $PWD, ~/tmp, ~/
#MARIONNET_TMPDIR=/my-non-standard-tmp-directory-supporting-sparse-files

# Disable warnings:
#MARIONNET_DISABLE_WARNING_TEMPORARY_WORKING_DIRECTORY_AUTOMATICALLY_SET=true
# The second one silences the startup notice about the run directories
# ($MARIONNET_TMPDIR/marionnet-<n>.dir/) left behind by the sessions that did not exit through
# the GUI. Marionnet never removes them by itself: each one holds the working copy of a project
# that was not saved. Sort them out with `useful-scripts/marionnet-cleanup --purge-dirs'.
#MARIONNET_DISABLE_WARNING_ORPHAN_RUN_DIRECTORIES=true
# The third one silences the two notices about another Marionnet running at the same time:
# the one shown at start-up, and the one shown when a virtual machine is actually left without
# network because another session already routes its address. Nothing forbids two simultaneous
# sessions; they simply share the host address of their taps (172.23.0.254) and number their
# machines independently.
#MARIONNET_DISABLE_WARNING_OTHER_MARIONNET_SESSIONS=true

# When this flag is "true", all intermediate snapshots are also saved in the
# .mar project, not only the most recent ones. In order to save disk space and
# time leave this flag to "false":
MARIONNET_KEEP_ALL_SNAPSHOTS_WHEN_SAVING=false

# Force the timezone for virtual machines:
#MARIONNET_TIMEZONE=Europe/Paris
